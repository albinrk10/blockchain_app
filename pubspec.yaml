name: blockchain_app
description: "A modern real-time cryptocurrency tracker built with Flutter, Clean Architecture, and Functional Programming."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.6
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  fpdart: ^1.1.0
  http: ^1.2.1
  intl: ^0.19.0
  provider: ^6.1.2
  web_socket_channel: ^2.4.4

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
